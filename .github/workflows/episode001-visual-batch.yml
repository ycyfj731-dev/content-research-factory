name: Episode 001 Offline Visual Gates
on:
  push:
    paths:
      - 'projects/youtube/001-therapy-speak/**'
      - 'tests/test_visual_pipeline.py'
      - '.github/workflows/episode001-visual-batch.yml'
  pull_request:
    paths:
      - 'projects/youtube/001-therapy-speak/**'
      - 'tests/test_visual_pipeline.py'
      - '.github/workflows/episode001-visual-batch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_visual_pipeline.py -v
      - run: python projects/youtube/001-therapy-speak/visual-batch-v1/batch.py --mode dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: episode001-v61-34unit-offline-manifest-NOT-IMAGES
          path: projects/youtube/001-therapy-speak/visual-batch-v1/outputs/prompt_manifest.json
