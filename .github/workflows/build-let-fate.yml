name: Build Let Fate APK

on:
  push:
    branches:
      - let-fate-vogue-apk
    paths:
      - 'apps/let-fate/**'
      - '.github/workflows/build-let-fate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/let-fate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LetFate-v1.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LetFate-v1.1-APK
          path: apps/let-fate/LetFate-v1.1.apk
          if-no-files-found: error
