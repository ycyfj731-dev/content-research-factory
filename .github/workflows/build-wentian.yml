name: Build Wentian APK

on:
  push:
    branches:
      - wentian-liuyao-v1
    paths:
      - 'apps/wentian/**'
      - '.github/workflows/build-wentian.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/wentian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Wentian-v1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Wentian-v1.0-APK
          path: apps/wentian/Wentian-v1.0.apk
          if-no-files-found: error
