[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "content-research-factory"
version = "0.2.0"
description = "Research-to-production orchestration for social content."
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "mcp>=1.0"
]

[project.scripts]
crf = "content_research_factory.cli:main"

[project.optional-dependencies]
test = [
  "pytest>=8.0"
]
sources = [
  "crawl4ai>=0.9.0",
  "tikhub>=2.1.0"
]
semantic = [
  "sentence-transformers>=3.0",
  "bertopic>=0.16"
]
full = [
  "crawl4ai>=0.9.0",
  "tikhub>=2.1.0",
  "sentence-transformers>=3.0",
  "bertopic>=0.16"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
