    - "江西 锂矿"
    - "碳酸锂 现货"
    - "碳酸锂 基差"
  query_families:
    positioning:
      - "看多"
      - "看空"
      - "做多"
      - "做空"
      - "多头"
      - "空头"
      - "增仓"
      - "减仓"
      - "逼仓"
      - "挤仓"
      - "爆仓"
    price_action:
      - "上涨"
      - "下跌"
      - "反弹"
      - "破位"
      - "见底"
      - "见顶"
      - "目标价"
    physical_market:
      - "现货"
      - "基差"
      - "升贴水"
      - "仓单"
      - "仓单注销"
      - "仓单注册"
      - "社会库存"
      - "贸易库存"
      - "正极厂库存"
    supply:
      - "排产"
      - "增产"
      - "减产"
      - "复产"
      - "停产"
      - "检修"
      - "锂辉石"
      - "锂云母"
      - "盐湖"
      - "津巴布韦"
      - "宜春"
      - "江西锂矿"
      - "到港"
    demand:
      - "补库"
      - "旺季"
      - "正极"
      - "电池厂"
      - "储能"
      - "新能源汽车"
    structure:
      - "back"
      - "backwardation"
      - "contango"
      - "月差"
      - "近月"
      - "远月"
  narrative_seed_tags:
    - "zimbabwe_supply"
    - "jiangxi_restart"
    - "warehouse_receipts"
    - "holiday_restocking"
    - "social_inventory"
    - "spot_futures_basis"
    - "production_growth"
    - "deliverable_supply_squeeze"

source_groups:
  institution:
    overall_weight: 0.45
    default_source_weight: 1.0
  kol:
    overall_weight: 0.30
    default_source_weight: 1.0
  crowd:
    overall_weight: 0.25
    default_source_weight: 1.0

freshness_half_life_days:
  intraday: 0.5
  "1_5d": 2.0
  "6_20d": 7.0
  "21_60d": 21.0
  longer: 60.0
  unspecified: 7.0

weighting:
  explicit_position_factor: 1.25
  conviction_floor: 0.25
  conviction_scale: 0.75

normalization:
  raw_definition: "exact-deduped captured stream before semantic-repeat and concentration controls"
  normalized_definition: "semantic-repeat discounted, concentration-capped, source-group-balanced consensus"
  caps_by_group:
    institution:
      platform_max_share: 0.55
      author_max_share: 0.15
      parent_post_max_share: 1.0
    kol:
      platform_max_share: 0.45
      author_max_share: 0.08
      parent_post_max_share: 0.20
    crowd:
      platform_max_share: 0.40
      author_max_share: 0.02
      parent_post_max_share: 0.08

collection:
  mode: "web_wide_first"
  web_wide_capture:
    enabled: true
    principle: "capture the broad daily public conversation first, then normalize it"
    exact_dedup_required: true
    semantic_expansion_required: true
  fixed_panel:
    enabled: true
    role: "calibration_anchor"
    principle: "keep source identities stable through time for coverage calibration"
  dynamic_discovery:
    enabled: true
    role: "primary_discovery"
  comment_sampling:
    top: 15
    latest: 15
    random: 20
  daily_targets:
    institution_observations: 10
    kol_observations: 30
    crowd_observations: 300

platforms:
  weibo:
    preferred_route: "MediaCrawler"
    fallback: "Agent-Reach/search"
  xiaohongshu:
    preferred_route: "MediaCrawler"
    fallback: "Agent-Reach"
  douyin:
    preferred_route: "MediaCrawler"
    fallback: "public-search-or-authorized-provider"
  wechat_official:
    preferred_route: "authorized-commercial-provider-or-search"
    fallback: "coverage_missing"
  video_account:
    preferred_route: "authorized-commercial-provider-or-search"
    fallback: "coverage_missing"
  institution_web:
    preferred_route: "Agent-Reach/search"
    fallback: "direct-public-web"

quality:
  require_coverage_metadata: true
  lock_daily_scores: true
  preserve_raw_hash: true
  preserve_model_version: true
  no_hindsight_relabeling: true

market_snapshot_fields:
  - "futures_price"
  - "spot_price"
  - "basis"
  - "warehouse_receipts"
  - "warehouse_receipts_delta"
  - "social_inventory"
  - "social_inventory_delta"
  - "open_interest"
  - "open_interest_delta"
  - "near_far_spread"
  - "production"
  - "ore_arrivals"
